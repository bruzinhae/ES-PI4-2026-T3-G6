spring.application.name=acaistudy

# Preferir MONGODB_URI no ambiente (Atlas / Compass).
# Fallback local: Docker Compose em backend/docker-compose.yml
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/acaistudy}
spring.data.mongodb.auto-index-creation=true

# O cliente estático servido pelo Live Server usa uma origem diferente do backend.
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501}
